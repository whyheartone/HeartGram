name: Release

# Релиз для OTA-обновлений: приложение смотрит список релизов этого репозитория.
# Тег содержит версию (например v13.2.1-hg5): по ней и по коммиту клиент понимает, что вышло новее.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Пометить релиз как pre-release (клиенты на канале «стабильный» его не увидят)'
        type: boolean
        default: true
      notes:
        description: 'Описание изменений'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "2G"

jobs:
  build:
    name: Release APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: [universal]
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      HG_LIST_URL: ${{ secrets.HG_LIST_URL }}
      HG_SEAL_KEY: ${{ secrets.HG_SEAL_KEY }}
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> "$GITHUB_ENV"
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk-${{ matrix.target }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
      - name: Firebase config (own project, if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > TMessagesProj/google-services.json
            echo "own google-services.json written"
          fi
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
            echo "signing key restored"
          else
            echo "::warning::RELEASE_KEYSTORE не задан: APK подпишется случайным отладочным ключом, обновление поверх прошлой версии не поставится"
          fi
      - name: Release build
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          BUILD_TIMESTAMP=$(date +%s)
          export BUILD_TIMESTAMP
          ./gradlew --stacktrace TMessagesProj:assembleRelease
      - name: Name the APK by ABI
        run: |
          mkdir -p out
          SRC=$(find TMessagesProj/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$SRC" "out/HeartGram.apk"
          ls -la out
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HeartGram-${{ matrix.target }}
          path: out/*.apk
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          path: apks
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}-beta${GITHUB_RUN_NUMBER}"
          fi
          NOTES="${NOTES_INPUT:-HeartGram ${TAG}}"
          FLAGS=""
          if [ "${PRERELEASE}" = "true" ]; then FLAGS="--prerelease"; fi
          # один APK без пометки ABI: HeartGram-<тег>.apk
          for f in apks/*.apk; do
            mv "$f" "apks/HeartGram-${TAG}.apk"
          done
          ls -la apks
          gh release create "$TAG" apks/*.apk --target "$GITHUB_SHA" --title "HeartGram ${TAG}" --notes "$NOTES" $FLAGS
